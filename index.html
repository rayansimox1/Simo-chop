<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">BOKA Store - Digital Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #000000;
            --accent-color: #22c55e;
            --promo-color: #ef4444;
            --bg-color: #f8fafc;
        }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg-color); }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        .bg-primary { background-color: var(--primary-color) !important; }
        .text-primary { color: var(--primary-color) !important; }
        .border-primary { border-color: var(--primary-color) !important; }
        .bg-accent { background-color: var(--accent-color) !important; }
        .bg-promo { background-color: var(--promo-color) !important; }
    </style>
</head>
<body class="pb-28">

    <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg relative overflow-hidden">
        
        <!-- 1. صورة الغلاف -->
        <div class="relative h-44 bg-gradient-to-r from-gray-900 to-gray-700">
            <img id="coverImg" src="" alt="Cover" class="w-full h-full object-cover opacity-70">
            <button id="langBadge" class="absolute top-4 right-4 bg-white/90 backdrop-blur px-3 py-1 rounded-full text-xs font-semibold shadow">
                🇫🇷 FR
            </button>
        </div>

        <!-- 2. معلومات البروفايل -->
        <div class="relative px-5 pb-4 text-center border-b border-gray-100">
            <div class="relative -mt-14 mb-3 inline-block">
                <img id="logoImg" src="" alt="Logo" class="w-28 h-28 rounded-full border-4 border-white shadow-md object-cover bg-white">
                <span id="verifiedBadge" class="absolute bottom-1 right-1 bg-blue-500 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs border-2 border-white">
                    <i class="fa-solid fa-check"></i>
                </span>
            </div>
            <h1 id="storeNameEl" class="text-xl font-bold text-gray-900"></h1>
            <p id="storeBioEl" class="text-xs text-gray-500 mt-1"></p>

            <div class="flex justify-center gap-3 mt-4">
                <a id="phoneLink" href="#" class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center text-gray-700 hover:bg-black hover:text-white transition"><i class="fa-solid fa-phone"></i></a>
                <a id="waLink" href="#" target="_blank" class="w-10 h-10 rounded-full bg-green-100 flex items-center justify-center text-green-600 hover:bg-green-600 hover:text-white transition"><i class="fa-brands fa-whatsapp text-lg"></i></a>
                <a id="igLink" href="#" target="_blank" class="w-10 h-10 rounded-full bg-pink-100 flex items-center justify-center text-pink-600 hover:bg-pink-600 hover:text-white transition"><i class="fa-brands fa-instagram text-lg"></i></a>
            </div>
        </div>

        <!-- 3. البحث والتصنيفات -->
        <div class="sticky top-0 bg-white/95 backdrop-blur z-10 px-4 py-3 border-b border-gray-100">
            <div class="relative mb-3">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-gray-400 text-sm"></i>
                <input type="text" id="searchInput" oninput="filterProducts()" placeholder="Rechercher une couleur, un modèle..." class="w-full pl-10 pr-4 py-2 bg-gray-100 rounded-xl text-sm focus:outline-none">
            </div>
            <div class="flex gap-2 overflow-x-auto hide-scroll pb-1" id="categories"></div>
        </div>

        <!-- 4. شبكة المنتجات -->
        <div class="p-4 grid grid-cols-2 gap-3.5" id="productsGrid"></div>

    </div>

    <!-- 5. نافذة تفاصيل المنتج ومعرض الصور -->
    <div id="productModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-40 hidden flex items-end sm:items-center justify-center">
        <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 max-h-[90vh] overflow-y-auto relative">
            <button onclick="closeProductModal()" class="absolute top-4 right-4 z-10 w-9 h-9 rounded-full bg-white/80 backdrop-blur shadow flex items-center justify-center text-gray-800 hover:bg-black hover:text-white transition">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div class="h-64 bg-gray-100 rounded-2xl overflow-hidden mb-3">
                <img id="modalMainImg" src="" class="w-full h-full object-cover transition duration-300">
            </div>
            <div id="modalThumbnails" class="flex gap-2 overflow-x-auto hide-scroll pb-2 mb-3"></div>
            <span id="modalCategory" class="text-[11px] font-semibold text-green-600 bg-green-50 px-2.5 py-1 rounded-full"></span>
            <h2 id="modalTitle" class="text-lg font-bold text-gray-900 mt-2"></h2>
            <div class="flex items-baseline gap-2 mt-1 mb-3">
                <span id="modalPrice" class="text-xl font-bold text-primary"></span>
                <span id="modalOldPrice" class="text-xs text-gray-400 line-through"></span>
            </div>
            <p id="modalDesc" class="text-xs text-gray-600 leading-relaxed mb-5"></p>
            <button id="modalAddBtn" class="w-full bg-primary text-white font-semibold py-3.5 rounded-xl flex items-center justify-center gap-2 shadow-lg hover:opacity-95 transition">
                <i class="fa-solid fa-cart-plus"></i>
                <span>Ajouter au panier</span>
            </button>
        </div>
    </div>

    <!-- 6. الشريط السفلي للسلة -->
    <div id="bottomCart" onclick="toggleCartModal()" class="fixed bottom-4 left-1/2 -translate-x-1/2 w-11/12 max-w-md bg-primary text-white p-4 rounded-2xl shadow-2xl flex justify-between items-center cursor-pointer transition-all transform translate-y-28 z-20">
        <div class="flex items-center gap-3">
            <div class="bg-white/20 w-10 h-10 rounded-xl flex items-center justify-center font-bold" id="cartBadge">0</div>
            <div>
                <p class="text-xs text-gray-300">Total du panier</p>
                <p class="font-bold text-sm" id="cartTotalBar">0 MAD</p>
            </div>
        </div>
        <div class="flex items-center gap-2 font-semibold text-sm bg-accent px-4 py-2 rounded-xl">
            <span>Commander</span>
            <i class="fa-solid fa-arrow-right"></i>
        </div>
    </div>

    <!-- 7. نافذة إتمام الطلب -->
    <div id="cartModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-30 hidden flex items-end justify-center">
        <div class="bg-white w-full max-w-md rounded-t-3xl p-5 max-h-[85vh] flex flex-col">
            <div class="flex justify-between items-center border-b pb-3 mb-4">
                <h2 class="font-bold text-lg">Votre Panier 🛒</h2>
                <button onclick="toggleCartModal()" class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-gray-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="cartItemsList" class="overflow-y-auto flex-1 space-y-3 pr-1 mb-4"></div>
            <div class="space-y-2.5 border-t pt-3 mb-4">
                <input type="text" id="clientName" placeholder="Votre Nom complet *" class="w-full p-2.5 bg-gray-100 rounded-xl text-sm focus:outline-none">
                <input type="text" id="clientCity" placeholder="Ville et Adresse *" class="w-full p-2.5 bg-gray-100 rounded-xl text-sm focus:outline-none">
                <input type="tel" id="clientPhone" placeholder="Numéro de téléphone *" class="w-full p-2.5 bg-gray-100 rounded-xl text-sm focus:outline-none">
            </div>
            <button onclick="sendWhatsAppOrder()" class="w-full bg-accent text-white font-bold py-3.5 rounded-xl flex items-center justify-center gap-2 shadow-lg">
                <i class="fa-brands fa-whatsapp text-xl"></i>
                <span>Commander sur WhatsApp (<span id="modalTotal">0</span> <span id="modalCurrency">MAD</span>)</span>
            </button>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'boka_store_config_v1';

        const defaultData = {
            store: {
                name: "BOKA Store",
                bio: "Parapluies automatiques & accessoires de qualité ⚡",
                logo: "1000385822.jpg",
                cover: "https://images.unsplash.com/photo-1515694346937-94d85e41e6f0?auto=format&fit=crop&w=800&q=80",
                langBadge: "🇫🇷 FR",
                verified: true,
                currency: "MAD",
                whatsapp: "212600000000",
                phone: "212600000000",
                instagram: "https://instagram.com"
            },
            design: {
                primaryColor: "#000000",
                accentColor: "#22c55e",
                promoColor: "#ef4444",
                bgColor: "#f8fafc",
                gridCols: "2",
                cardRadius: "rounded-2xl",
                fontFamily: "'Poppins', sans-serif"
            },
            categories: [
                { id: "Tous", label: "Tous" },
                { id: "Parapluies", label: "☔ Parapluies" },
                { id: "Packs", label: "🎁 Packs Promo" }
            ],
            products: [
                { id: 1, name: "Parapluie Automatique - Noir Classique", category: "Parapluies", price: 149, oldPrice: 199, img: "1000385822.jpg", gallery: ["1000385822.jpg", "1000385824.jpg", "1000385832.jpg"], desc: "Parapluie pliable automatique ultra-résistant au vent avec revêtement imperméable et pochette incluse. Ouverture et fermeture d'une seule main." },
                { id: 2, name: "Parapluie Automatique - Rose Poudré", category: "Parapluies", price: 149, oldPrice: 199, img: "1000385820.jpg", gallery: ["1000385820.jpg", "1000385828.jpg", "1000385822.jpg"], desc: "Design élégant en rose poudré. Protection anti-UV et imperméabilité supérieure avec bouton d'ouverture automatique." },
                { id: 3, name: "Parapluie Automatique - Bleu Ardoise", category: "Parapluies", price: 149, oldPrice: 199, img: "1000385832.jpg", gallery: ["1000385832.jpg", "1000385822.jpg", "1000385824.jpg"], desc: "Couleur bleu ardoise moderne, structure renforcée et séchage rapide. Livré avec sa housse de protection." },
                { id: 4, name: "Parapluie Automatique - Vert Pistache", category: "Parapluies", price: 149, oldPrice: 199, img: "1000385826.jpg", gallery: ["1000385826.jpg", "1000385830.jpg", "1000385828.jpg"], desc: "Couleur fraîche et originale, format compact idéal pour le sac à main ou la voiture." },
                { id: 5, name: "Parapluie Automatique - Gris Perle", category: "Parapluies", price: 149, oldPrice: 199, img: "1000385824.jpg", gallery: ["1000385824.jpg", "1000385822.jpg", "1000385828.jpg"], desc: "Gris perle sobre et chic. Poignée ergonomique avec dragonne et bouton automatique." },
                { id: 6, name: "Parapluie Automatique - Vert Émeraude", category: "Parapluies", price: 149, oldPrice: 199, img: "1000385830.jpg", gallery: ["1000385830.jpg", "1000385826.jpg", "1000385822.jpg"], desc: "Vert émeraude profond avec finitions dorées sur la poignée. Haute résistance aux intempéries." },
                { id: 7, name: "Parapluie Automatique - Beige Crème", category: "Parapluies", price: 149, oldPrice: 199, img: "1000385828.jpg", gallery: ["1000385828.jpg", "1000385820.jpg", "1000385824.jpg"], desc: "Teinte beige crème minimaliste et luxueuse. Parfait contre la pluie et le soleil." }
            ]
        };

        const config = JSON.parse(localStorage.getItem(STORAGE_KEY)) || defaultData;
        const products = config.products;
        const CURRENCY = config.store.currency || 'MAD';
        let cart = {};
        let currentCategory = 'Tous';

        function applyStoreDesignAndProfile() {
            // تطبيق الألوان والخطوط
            document.documentElement.style.setProperty('--primary-color', config.design.primaryColor);
            document.documentElement.style.setProperty('--accent-color', config.design.accentColor);
            document.documentElement.style.setProperty('--promo-color', config.design.promoColor);
            document.documentElement.style.setProperty('--bg-color', config.design.bgColor);
            document.body.style.fontFamily = config.design.fontFamily;

            // تطبيق معلومات البروفايل
            document.getElementById('pageTitle').innerText = config.store.name;
            document.getElementById('storeNameEl').innerText = config.store.name;
            document.getElementById('storeBioEl').innerText = config.store.bio;
            document.getElementById('logoImg').src = config.store.logo;
            document.getElementById('coverImg').src = config.store.cover;
            document.getElementById('langBadge').innerText = config.store.langBadge;
            document.getElementById('verifiedBadge').style.display = config.store.verified ? 'flex' : 'none';
            document.getElementById('modalCurrency').innerText = CURRENCY;

            // الروابط
            document.getElementById('phoneLink').href = `tel:${config.store.phone}`;
            document.getElementById('waLink').href = `https://wa.me/${config.store.whatsapp}`;
            document.getElementById('igLink').href = config.store.instagram;

            // تخطيط الشبكة
            const grid = document.getElementById('productsGrid');
            grid.className = `p-4 grid grid-cols-${config.design.gridCols} gap-3.5`;

            // عرض الفئات
            const catContainer = document.getElementById('categories');
            catContainer.innerHTML = '';
            config.categories.forEach(cat => {
                const isActive = cat.id === currentCategory;
                catContainer.innerHTML += `
                    <button onclick="setCategory('${cat.id}')" class="cat-btn ${isActive ? 'bg-primary text-white' : 'bg-gray-100 text-gray-600'} px-4 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition">
                        ${cat.label}
                    </button>
                `;
            });
        }

        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            const search = document.getElementById('searchInput').value.toLowerCase();
            const radius = config.design.cardRadius || 'rounded-2xl';
            grid.innerHTML = '';

            const filtered = products.filter(p => {
                const matchCat = currentCategory === 'Tous' || p.category === currentCategory;
                const matchSearch = p.name.toLowerCase().includes(search);
                return matchCat && matchSearch;
            });

            filtered.forEach(p => {
                const qty = cart[p.id] ? cart[p.id].qty : 0;
                grid.innerHTML += `
                    <div class="bg-white ${radius} border border-gray-100 shadow-sm overflow-hidden flex flex-col justify-between hover:shadow-md transition">
                        <div onclick="openProductModal(${p.id})" class="cursor-pointer">
                            <div class="relative h-40 bg-gray-100">
                                <img src="${p.img}" alt="${p.name}" class="w-full h-full object-cover">
                                ${p.oldPrice ? `<span class="absolute top-2 left-2 bg-promo text-white text-[10px] font-bold px-2 py-0.5 rounded-full">Promo</span>` : ''}
                                <span class="absolute bottom-2 right-2 bg-black/60 backdrop-blur text-white text-[10px] px-2 py-0.5 rounded-full flex items-center gap-1">
                                    <i class="fa-regular fa-images"></i> ${p.gallery.length}
                                </span>
                            </div>
                            <div class="p-3">
                                <span class="text-[10px] text-gray-400 font-medium">${p.category}</span>
                                <h3 class="text-xs font-semibold text-gray-800 line-clamp-2 mt-0.5 h-8">${p.name}</h3>
                                <div class="mt-2 flex items-baseline gap-1.5">
                                    <span class="font-bold text-sm text-primary">${p.price} ${CURRENCY}</span>
                                    ${p.oldPrice ? `<span class="text-[10px] text-gray-400 line-through">${p.oldPrice} ${CURRENCY}</span>` : ''}
                                </div>
                            </div>
                        </div>
                        <div class="px-3 pb-3">
                            ${qty === 0 ? `
                                <button onclick="updateQty(${p.id}, 1)" class="w-full bg-primary text-white text-xs font-medium py-2 rounded-xl flex items-center justify-center gap-1.5 transition hover:opacity-90">
                                    <i class="fa-solid fa-plus text-[10px]"></i> Ajouter
                                </button>
                            ` : `
                                <div class="flex items-center justify-between bg-gray-100 rounded-xl p-1">
                                    <button onclick="updateQty(${p.id}, -1)" class="w-7 h-7 rounded-lg bg-white shadow text-xs font-bold">-</button>
                                    <span class="text-xs font-bold">${qty}</span>
                                    <button onclick="updateQty(${p.id}, 1)" class="w-7 h-7 rounded-lg bg-primary text-white shadow text-xs font-bold">+</button>
                                </div>
                            `}
                        </div>
                    </div>
                `;
            });
        }

        function openProductModal(id) {
            const p = products.find(item => item.id === id);
            if (!p) return;

            document.getElementById('modalMainImg').src = p.img;
            document.getElementById('modalCategory').innerText = p.category;
            document.getElementById('modalTitle').innerText = p.name;
            document.getElementById('modalPrice').innerText = `${p.price} ${CURRENCY}`;
            document.getElementById('modalOldPrice').innerText = p.oldPrice ? `${p.oldPrice} ${CURRENCY}` : '';
            document.getElementById('modalDesc').innerText = p.desc;

            const thumbsContainer = document.getElementById('modalThumbnails');
            thumbsContainer.innerHTML = '';
            p.gallery.forEach((imgUrl, index) => {
                thumbsContainer.innerHTML += `
                    <img src="${imgUrl}" onclick="changeModalImg('${imgUrl}', this)" 
                         class="thumb-img w-16 h-16 rounded-xl object-cover cursor-pointer border-2 ${index === 0 ? 'border-primary' : 'border-transparent opacity-70'} transition">
                `;
            });

            const addBtn = document.getElementById('modalAddBtn');
            addBtn.onclick = () => {
                updateQty(p.id, 1);
                closeProductModal();
            };

            document.getElementById('productModal').classList.remove('hidden');
        }

        function changeModalImg(url, el) {
            document.getElementById('modalMainImg').src = url;
            document.querySelectorAll('.thumb-img').forEach(img => {
                img.classList.remove('border-primary');
                img.classList.add('border-transparent', 'opacity-70');
            });
            el.classList.remove('border-transparent', 'opacity-70');
            el.classList.add('border-primary');
        }

        function closeProductModal() {
            document.getElementById('productModal').classList.add('hidden');
        }

        function setCategory(cat) {
            currentCategory = cat;
            applyStoreDesignAndProfile();
            renderProducts();
        }

        function filterProducts() { renderProducts(); }

        function updateQty(id, change) {
            const product = products.find(p => p.id === id);
            if (!cart[id]) cart[id] = { ...product, qty: 0 };
            cart[id].qty += change;
            if (cart[id].qty <= 0) delete cart[id];
            
            renderProducts();
            updateCartUI();
        }

        function updateCartUI() {
            const items = Object.values(cart);
            const totalQty = items.reduce((sum, i) => sum + i.qty, 0);
            const totalPrice = items.reduce((sum, i) => sum + (i.price * i.qty), 0);

            document.getElementById('cartBadge').innerText = totalQty;
            document.getElementById('cartTotalBar').innerText = `${totalPrice} ${CURRENCY}`;
            document.getElementById('modalTotal').innerText = totalPrice;

            const bottomCart = document.getElementById('bottomCart');
            if (totalQty > 0) {
                bottomCart.classList.remove('translate-y-28');
            } else {
                bottomCart.classList.add('translate-y-28');
                document.getElementById('cartModal').classList.add('hidden');
            }

            const list = document.getElementById('cartItemsList');
            list.innerHTML = '';
            items.forEach(item => {
                list.innerHTML += `
                    <div class="flex items-center justify-between bg-gray-50 p-2.5 rounded-xl">
                        <div class="flex items-center gap-3">
                            <img src="${item.img}" class="w-12 h-12 rounded-lg object-cover">
                            <div>
                                <h4 class="text-xs font-semibold">${item.name}</h4>
                                <p class="text-xs font-bold text-gray-500">${item.price} ${CURRENCY} x ${item.qty}</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="updateQty(${item.id}, -1)" class="w-6 h-6 bg-white border rounded-md text-xs">-</button>
                            <span class="text-xs font-bold">${item.qty}</span>
                            <button onclick="updateQty(${item.id}, 1)" class="w-6 h-6 bg-primary text-white rounded-md text-xs">+</button>
                        </div>
                    </div>
                `;
            });
        }

        function toggleCartModal() {
            document.getElementById('cartModal').classList.toggle('hidden');
        }

        function sendWhatsAppOrder() {
            const name = document.getElementById('clientName').value.trim();
            const city = document.getElementById('clientCity').value.trim();
            const phone = document.getElementById('clientPhone').value.trim();
            if (!name || !city || !phone) {
                alert("Veuillez remplir tous les champs (Nom, Ville, Téléphone).");
                return;
            }

            let text = `*Nouvelle Commande - ${config.store.name}* ☔\n\n`;
            text += `*Client:* ${name}\n*Tél:* ${phone}\n*Adresse:* ${city}\n\n*Articles:*\n`;
            
            let total = 0;
            Object.values(cart).forEach(item => {
                const sub = item.price * item.qty;
                total += sub;
                text += `▪️ ${item.qty}x ${item.name} (${sub} ${CURRENCY})\n`;
            });

            text += `\n*TOTAL À PAYER : ${total} ${CURRENCY}*`;
            window.open(`https://wa.me/${config.store.whatsapp}?text=${encodeURIComponent(text)}`, '_blank');
        }

        applyStoreDesignAndProfile();
        renderProducts();
    </script>
</body>
</html>
